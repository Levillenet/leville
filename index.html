<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Default title - overridden by react-helmet-async per page.
         Kept SEO-friendly as a fallback for non-JS / social crawlers.
         NOTE: no static <meta name="description"> here — Helmet owns it per page
         and a static one would duplicate on every route. -->
    <title>Majoitus Levillä – Vuokramökit ja huoneistot keskustassa</title>

    
    <!-- Author meta - global -->
    <meta name="author" content="Leville.net" />
    
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <!-- Bing Webmaster Tools verification -->
    <meta name="msvalidate.01" content="A7939E8C8F8AD766041B6E438F42BDBC" />
    
    <!-- Hreflang tags are managed dynamically by HreflangTags.tsx component -->
    
    <!-- 
      IMPORTANT: All SEO meta tags (description, og:*, twitter:*) are managed 
      dynamically per-page via react-helmet-async. Do NOT add static meta 
      description, og:title, og:description, twitter:title, or twitter:description 
      here as they will cause duplication issues.
    -->

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0a1628" />

    <!-- Microsoft Clarity loaded dynamically via CookieConsent component -->

    <!-- LCP Fix 1: Preload hero image so browser fetches it before JS bundle.
         Responsive: phones get the 640px variant, tablets 1024px, desktop full. -->
    <link rel="preload" as="image" href="/hero-chalet.webp"
          imagesrcset="/hero-chalet-640.webp 640w, /hero-chalet-1024.webp 1024w, /hero-chalet.webp 1536w"
          imagesizes="100vw" fetchpriority="high">

    <!-- Self-hosted fonts (no Google Fonts round-trip). Preload the two used above the fold. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-sans-latin.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cormorant-garamond-latin.woff2" crossorigin>

    <!-- Booking widget origin: warm up the connection, script itself loads when idle -->
    <link rel="preconnect" href="https://moder-embeds-dev.s3.eu-north-1.amazonaws.com" crossorigin>


  </head>

  <body style="background-color:#152030">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
